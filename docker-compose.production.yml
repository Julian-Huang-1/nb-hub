name: nb-hub-prod

x-api: &api
  image: ${API_IMAGE:-nb-hub-api:local}
  platform: ${DEPLOY_PLATFORM:-linux/amd64}
  build:
    context: .
    dockerfile: Dockerfile.api
  environment:
    APP_ENV: production
    JWT_SECRET: ${JWT_SECRET:?Generate JWT_SECRET with openssl rand -hex 32}
    FRONTEND_ORIGIN: https://${DOMAIN:?Set DOMAIN in .env.production}
    ALLOW_SIGNUP: ${ALLOW_SIGNUP:-true}
    ALLOWED_EMAILS: ${ALLOWED_EMAILS:-}
    ALLOWED_EMAIL_DOMAINS: ${ALLOWED_EMAIL_DOMAINS:-}
    AUTH_TOKEN_TTL: ${AUTH_TOKEN_TTL:-720h}
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USERNAME: ${SMTP_USERNAME:-}
    SMTP_PASSWORD: ${SMTP_PASSWORD:-}
    SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
    GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
    GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
    NB_HUB_SITES_ROOT: /var/lib/nb-hub/sites
    NB_HUB_CONTENT_DOMAIN: ${NB_HUB_CONTENT_DOMAIN:-}
    NB_HUB_SITES_OWNER_QUOTA_BYTES: ${NB_HUB_SITES_OWNER_QUOTA_BYTES:-1073741824}
    NB_HUB_SITES_TOTAL_QUOTA_BYTES: ${NB_HUB_SITES_TOTAL_QUOTA_BYTES:-5368709120}
    NB_HUB_LISTEN_ADDR: 0.0.0.0:8080
    DATABASE_URL: postgres://nbhub_prod:${POSTGRES_PASSWORD:?Run make prod-env first}@postgres:5432/nbhub_prod?sslmode=disable&pool_max_conns=4

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: nbhub_prod
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Run make prod-env first}
      POSTGRES_DB: nbhub_prod
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  migrate:
    <<: *api
    command: ["/app/migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *api
    volumes:
      - sites_data:/var/lib/nb-hub/sites
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/health"]
      interval: 10s
      timeout: 3s
      retries: 5

  web:
    image: ${WEB_IMAGE:-nb-hub-web:local}
    platform: ${DEPLOY_PLATFORM:-linux/amd64}
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NB_HUB_API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
    restart: unless-stopped

volumes:
  sites_data:
  postgres_data:
  caddy_data:
  caddy_config:
