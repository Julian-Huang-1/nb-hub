name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 检出代码
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 安装 Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "24.14.0" # 可根据需要修改 Node 版本

      # 3. 安装 pnpm
      - name: Install pnpm
        run: npm install -g pnpm

      # 4. 安装依赖
      - name: Install dependencies
        run: pnpm install

        # 5. Drizzle：schema 与 migrations 必须一致（漏跑 generate 会失败）
      - name: Drizzle schema / migrations check
        run: pnpm --filter @nb-hub/api-server exec drizzle-kit check

      # 6. CI 构建校验 — 编译不过就直接失败，不会触发部署
      - name: Build check
        run: pnpm -r build

      # 6. 运行你的部署脚本
      - name: Run deploy script
        env:
          ECS_HOST: ${{ secrets.ECS_HOST }}
          ECS_USER: ${{ secrets.ECS_USER }}
          ECS_SSH_KEY: ${{ secrets.ECS_SSH_KEY }}
        run: bash ./deploy.sh
